<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contract Readiness – License Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
      color: #111827;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 10px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    input[type="text"] {
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      flex: 1;
      min-width: 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1e40af;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 6px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #e5e7eb;
    }
    tr:nth-child(even) {
      background: #f9fafb;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
      color: white;
    }
    .badge-active {
      background: #16a34a;
    }
    .badge-inactive {
      background: #b91c1c;
    }
    #editPanel {
      margin-top: 16px;
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>License Admin</h1>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by name, email, company, license key">
      <button id="searchBtn">Search</button>
      <button id="refreshBtn">Refresh</button>
    </div>

    <div id="status"></div>

    <table id="licensesTable">
      <thead>
        <tr>
          <th>License Key</th>
          <th>Owner</th>
          <th>Company</th>
          <th>Email</th>
          <th>Notify Email</th>
          <th>Domains</th>
          <th>Plan</th>
          <th>Active</th>
          <th>Free Usage</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="editPanel">
      <h3>Edit License</h3>
      <div id="editKey" style="font-size:12px; color:#6b7280;"></div>
      <label>
        Company
        <input type="text" id="editCompany">
      </label>
      <label>
        Notify Email (lead destination for this buyer)
        <input type="text" id="editNotifyEmail" placeholder="leads@client.com">
      </label>
      <label>
        Allowed Domains (comma separated, e.g. example.com, clientsite.com)
        <input type="text" id="editDomains">
      </label>
      <label>
        <input type="checkbox" id="editActive"> Active
      </label>
      <label>
        <input type="checkbox" id="editFreeUsage"> Free usage (no per-use billing)
      </label>
      <button id="saveEditBtn">Save Changes</button>
    </div>
  </div>

  <script>
    const apiBase = 'https://contract-readiness-widget.onrender.com';
    let adminSecret = '';
    let licensesCache = [];
    let selectedKey = null;

    function promptAdminSecret() {
      adminSecret = window.prompt('Enter ADMIN_SECRET:');
      if (!adminSecret) {
        document.getElementById('status').textContent = 'Admin secret is required.';
      } else {
        loadLicenses();
      }
    }

    async function loadLicenses(search = '') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Loading licenses...';

      try {
        const params = new URLSearchParams();
        params.set('admin', adminSecret);
        if (search) params.set('search', search);

        const res = await fetch(apiBase + '/admin/licenses?' + params.toString());
        const data = await res.json();

        if (!data.ok) {
          statusEl.textContent = 'Error loading licenses.';
          return;
        }

        licensesCache = data.licenses || [];
        renderTable();
        statusEl.textContent = `Loaded ${licensesCache.length} license(s).`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error loading licenses.';
      }
    }

    function renderTable() {
      const tbody = document.querySelector('#licensesTable tbody');
      tbody.innerHTML = '';

      licensesCache.forEach(lic => {
        const tr = document.createElement('tr');

        const tdKey = document.createElement('td');
        tdKey.textContent = lic.key;
        tr.appendChild(tdKey);

        const tdOwner = document.createElement('td');
        tdOwner.textContent = (lic.first_name || '') + ' ' + (lic.last_name || '');
        tr.appendChild(tdOwner);

        const tdCompany = document.createElement('td');
        tdCompany.textContent = lic.company || '';
        tr.appendChild(tdCompany);

        const tdEmail = document.createElement('td');
        tdEmail.textContent = lic.email || '';
        tr.appendChild(tdEmail);

        const tdNotify = document.createElement('td');
        tdNotify.textContent = lic.notify_email || '';
        tr.appendChild(tdNotify);

        const tdDomains = document.createElement('td');
        tdDomains.textContent = Array.isArray(lic.allowed_domains)
          ? lic.allowed_domains.join(', ')
          : '';
        tr.appendChild(tdDomains);

        const tdPlan = document.createElement('td');
        tdPlan.textContent = lic.plan || '';
        tr.appendChild(tdPlan);

        const tdActive = document.createElement('td');
        const span = document.createElement('span');
        span.className = 'badge ' + (lic.active ? 'badge-active' : 'badge-inactive');
        span.textContent = lic.active ? 'Active' : 'Inactive';
        tdActive.appendChild(span);
        tr.appendChild(tdActive);

        const tdFree = document.createElement('td');
        tdFree.textContent = lic.free_usage ? 'Yes' : 'No';
        tr.appendChild(tdFree);

        const tdCreated = document.createElement('td');
        tdCreated.textContent = lic.created_at || '';
        tr.appendChild(tdCreated);

        const tdActions = document.createElement('td');
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.style.fontSize = '11px';
        editBtn.addEventListener('click', () => openEdit(lic));
        tdActions.appendChild(editBtn);
        tr.appendChild(tdActions);

        tbody.appendChild(tr);
      });
    }

    function openEdit(lic) {
      selectedKey = lic.key;
      document.getElementById('editKey').textContent = 'Editing license: ' + lic.key;
      document.getElementById('editCompany').value = lic.company || '';
      document.getElementById('editNotifyEmail').value = lic.notify_email || '';
      document.getElementById('editDomains').value = Array.isArray(lic.allowed_domains)
        ? lic.allowed_domains.join(', ')
        : '';
      document.getElementById('editActive').checked = !!lic.active;
      document.getElementById('editFreeUsage').checked = !!lic.free_usage;

      document.getElementById('editPanel').style.display = 'block';
    }

    async function saveEdit() {
      if (!selectedKey) return;

      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Saving...';

      const company = document.getElementById('editCompany').value.trim();
      const notifyEmail = document.getElementById('editNotifyEmail').value.trim();
      const domainsStr = document.getElementById('editDomains').value.trim();
      const active = document.getElementById('editActive').checked;
      const freeUsage = document.getElementById('editFreeUsage').checked;

      const allowed_domains = domainsStr
        ? domainsStr.split(',').map(d => d.trim()).filter(Boolean)
        : [];

      try {
        const res = await fetch(
          apiBase + '/admin/licenses/' + encodeURIComponent(selectedKey) + '?admin=' + encodeURIComponent(adminSecret),
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              company,
              notify_email: notifyEmail,
              allowed_domains,
              active,
              free_usage: freeUsage
            })
          }
        );
        const data = await res.json();
        if (!data.ok) {
          statusEl.textContent = 'Error saving license changes.';
          return;
        }

        statusEl.textContent = 'License updated.';
        document.getElementById('editPanel').style.display = 'none';
        selectedKey = null;
        loadLicenses(document.getElementById('searchInput').value.trim());
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error saving license changes.';
      }
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      const q = document.getElementById('searchInput').value.trim();
      loadLicenses(q);
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      loadLicenses('');
    });

    document.getElementById('saveEditBtn').addEventListener('click', saveEdit);

    window.addEventListener('load', promptAdminSecret);
  </script>
</body>
</html>
