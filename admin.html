<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>License Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background: #f9fafb;
    }
    h2 {
      text-align: center;
      margin-bottom: 8px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      max-width: 320px;
      margin: 0 auto;
      text-align: center;
    }
    label {
      font-size: 13px;
      text-align: left;
      margin-top: 4px;
    }
    input, button {
      margin: 4px 0;
      padding: 6px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1e40af;
    }
    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
    }
    .status.error {
      color: #b91c1c;
    }
    .status.ok {
      color: #15803d;
    }
    .metrics {
      text-align: center;
      margin-top: 6px;
      font-size: 13px;
      color: #374151;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 4px;
      text-align: left;
    }
    th {
      background: #e5e7eb;
    }
    tr.inactive {
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <h2>Contract Readiness Widget – Admin Dashboard</h2>
  <div class="controls">
    <label>Admin Secret:</label>
    <input id="adminSecret" type="password" placeholder="Enter admin secret">

    <label>Search (name, email, company, license):</label>
    <input id="search" type="text" placeholder="Search...">

    <button id="loadBtn">Load Licenses</button>
  </div>

  <div id="statusMsg" class="status"></div>
  <div id="metrics" class="metrics"></div>

  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>License</th>
        <th>Name</th>
        <th>Email</th>
        <th>Company</th>
        <th>Domains</th>
        <th>Active</th>
        <th>Created</th>
        <th>Toggle</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // 🔴 Make sure this matches your Render URL
    const apiBase = 'https://contract-readiness-widget.onrender.com';

    async function loadLicenses() {
      const secret = document.getElementById('adminSecret').value.trim();
      const search = document.getElementById('search').value.trim();
      const statusMsg = document.getElementById('statusMsg');
      const metrics = document.getElementById('metrics');
      const table = document.getElementById('table');
      const tbody = table.querySelector('tbody');

      statusMsg.textContent = 'Loading licenses...';
      statusMsg.className = 'status';
      metrics.textContent = '';
      tbody.innerHTML = '';
      table.style.display = 'none';

      if (!secret) {
        statusMsg.textContent = 'Please enter your admin secret.';
        statusMsg.className = 'status error';
        return;
      }

      let data;
      try {
        const res = await fetch(apiBase + '/admin/licenses?search=' + encodeURIComponent(search), {
          headers: { 'x-admin-secret': secret }
        });

        if (!res.ok) {
          statusMsg.textContent = 'Server error: HTTP ' + res.status;
          statusMsg.className = 'status error';
          return;
        }

        data = await res.json();
      } catch (err) {
        console.error(err);
        statusMsg.textContent = 'Error contacting server. Check API URL or network.';
        statusMsg.className = 'status error';
        return;
      }

      if (!data.ok) {
        statusMsg.textContent = 'Error: ' + (data.error || 'Unable to load');
        statusMsg.className = 'status error';
        return;
      }

      const licenses = data.licenses || [];

      if (!licenses.length) {
        statusMsg.textContent = 'No licenses found.';
        statusMsg.className = 'status';
        return;
      }

      // Live metrics
      const total = licenses.length;
      const activeCount = licenses.filter(l => l.active).length;
      const inactiveCount = total - activeCount;
      const lastCreated = licenses[0].created_at || '';

      metrics.textContent =
        `Total: ${total} | Active: ${activeCount} | Inactive: ${inactiveCount}` +
        (lastCreated ? ` | Last created: ${lastCreated}` : '');

      licenses.forEach(lic => {
        const tr = document.createElement('tr');
        if (!lic.active) tr.classList.add('inactive');
        const domains = (lic.allowed_domains || []).join(', ');

        tr.innerHTML = `
          <td>${lic.key}</td>
          <td>${(lic.first_name || '')} ${(lic.last_name || '')}</td>
          <td>${lic.email || ''}</td>
          <td>${lic.company || ''}</td>
          <td>${domains}</td>
          <td>${lic.active ? 'Yes' : 'No'}</td>
          <td>${lic.created_at || ''}</td>
          <td><button data-key="${lic.key}" data-active="${lic.active ? '1':'0'}">
            ${lic.active ? 'Deactivate' : 'Activate'}
          </button></td>
        `;
        tbody.appendChild(tr);
      });

      table.style.display = 'table';
      statusMsg.textContent = `Loaded ${licenses.length} license(s).`;
      statusMsg.className = 'status ok';

      // Hook up toggle buttons
      tbody.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', async () => {
          const key = btn.getAttribute('data-key');
          const active = btn.getAttribute('data-active') === '1';
          const newActive = !active;

          try {
            const res = await fetch(apiBase + '/admin/licenses/' + encodeURIComponent(key), {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'x-admin-secret': secret
              },
              body: JSON.stringify({ active: newActive })
            });
            const updated = await res.json();
            if (!updated.ok) {
              alert('Error updating license: ' + (updated.error || 'unknown'));
            } else {
              loadLicenses();
            }
          } catch (err) {
            alert('Network error updating license.');
          }
        });
      });
    }

    document.getElementById('loadBtn').addEventListener('click', loadLicenses);
  </script>
</body>
</html>
